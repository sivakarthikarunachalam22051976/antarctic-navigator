services:
  - type: web
    name: antarctic-navigator-api
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: USE_REAL_DATA
        value: "1"
      - key: ALLOW_SYNTHETIC_FALLBACK
        value: "0"
      - key: FRONTEND_URL
        sync: false
